# ios-sideload builds on every push to main (owner request, september 27 2026);
# the other workflows stay manual. No paid billing or public release is configured.
workflows:
  ios-sideload:
    name: revision - personal iPhone build (no paid Apple account)
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      xcode: "26.6"
      node: "22.19.0"
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    scripts:
      - name: Install locked dependencies
        script: npm ci --no-audit --no-fund
      - name: Check and bundle the app
        script: |
          set -euo pipefail
          npm run lint
          npm test
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          npm run ios:sync
      - name: Compile for a physical iPhone
        script: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-sideload \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package for personal signing on the NAS
        script: |
          set -euo pipefail
          python3 -B scripts/package-ios-sideload.py \
            build/ios-sideload/Build/Products/Release-iphoneos/App.app \
            build/ios/ipa/revision-unsigned.ipa
    artifacts:
      - build/ios/ipa/revision-unsigned.ipa
      - build/ios/ipa/revision-unsigned.json

  ios-check:
    name: revision - unsigned iOS check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.6"
      node: "22.19.0"
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    scripts:
      - name: Install locked dependencies
        script: npm ci --no-audit --no-fund
      - name: Check app
        script: |
          set -euo pipefail
          npm run lint
          npm test
          npm run ios:sync
      - name: Compile for iPhone without signing
        script: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-check CODE_SIGNING_ALLOWED=NO build

  ios-testflight:
    name: revision - private iPhone update
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: revision
    environment:
      xcode: "26.6"
      node: "22.19.0"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.japaneserevision.app
      vars:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    scripts:
      - name: Install locked dependencies
        script: npm ci --no-audit --no-fund
      - name: Check and bundle the app
        script: |
          set -euo pipefail
          npm run lint
          npm test
          npm run ios:sync
      - name: Sign for internal TestFlight only
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Set a unique update number
        script: |
          set -euo pipefail
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build the installable app
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The owner's internal group enables automatic distribution.
        # Neither external beta review nor a public App Store release is requested.
        submit_to_testflight: false
        submit_to_app_store: false
